<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistent</title>
<meta name="description" content="Osobní přehled na jednom místě: schránka pro Clauda, pošta a kalendář.">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Asistent">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://europe-west1-asistent-michal.cloudfunctions.net; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; base-uri 'self'; form-action 'none'; object-src 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikony/ikona-192.png" type="image/png">
<link rel="apple-touch-icon" href="ikony/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="plakaty.css">
<!-- písma plakátu (Anton, Roboto Condensed – Impact a Arial Narrow na iPhonu nejsou): media="print", aby start aplikace
     na Google Fonts nečekal; na stránce Plakáty je js/plakaty.js přepne na all -->
<link rel="stylesheet" id="plakat-pisma" media="print" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Roboto+Condensed:wght@400;600;700&amp;display=swap">
<script src="js/start.js" defer></script>
<!-- knihovny účtu (Firebase) hned paralelně s aplikací – service worker je pak vydá ze zařízení -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js">
<!-- moduly aplikace všechny naráz hned s HTML (jinak je prohlížeč objevuje po patrech importů – na pomalé síti o dvě kola
     déle); seznam = co app.js načítá při startu, hlídá ho test „index.html: modulepreload“ (testy/test_aplikace.js) -->
<link rel="modulepreload" href="js/stav.js">
<link rel="modulepreload" href="js/api.js">
<link rel="modulepreload" href="js/pomocne.js">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/ikony.js">
<link rel="modulepreload" href="js/panely.js">
<link rel="modulepreload" href="js/schranka.js">
<link rel="modulepreload" href="js/posta.js">
<link rel="modulepreload" href="js/kalendar.js">
<link rel="modulepreload" href="js/nastaveni.js">
<link rel="modulepreload" href="js/hledat.js">
<link rel="modulepreload" href="js/udalost.js">
<link rel="modulepreload" href="js/pocasi.js">
<link rel="modulepreload" href="js/zdravi.js">
<link rel="modulepreload" href="js/fotbal.js">
<link rel="modulepreload" href="js/dochazka.js">
<link rel="modulepreload" href="js/reely.js">
<link rel="modulepreload" href="js/plakaty.js">
<link rel="modulepreload" href="js/auto.js">
<link rel="modulepreload" href="js/moje.js">
<link rel="modulepreload" href="js/nabidka.js">
<link rel="modulepreload" href="js/krouzky.js">
<link rel="modulepreload" href="js/adresy.js">
<link rel="modulepreload" href="js/ucet.js">
<link rel="modulepreload" href="js/rozbor.js">
<link rel="modulepreload" href="js/jmeniny.js">
<link rel="modulepreload" href="js/jidlo_odhad.js">
<link rel="modulepreload" href="js/grafy.js">
<link rel="modulepreload" href="js/plakat_data.js">
<link rel="modulepreload" href="js/plakat.js">
<link rel="modulepreload" href="js/wedos.js">
<script type="module" src="js/app.js"></script>
</head>
<body>

<div id="aplikace" class="aplikace" hidden>
  <!-- postranní panel: na iPadu jen ikony, na PC na Dnes s popisky a počty, jinde jen ikony (po najetí se rozbalí) -->
  <nav class="rail" id="rail" aria-label="Sekce"></nav>

  <div class="hlavni">
    <!-- horní lišta (iPad, PC): hledání, obnovit, hlavní akce; na Dnes mezi nimi malé přehledové dlaždice -->
    <div class="horni" id="horni"></div>
    <header class="hlava" id="hlava"></header>
    <div class="pruhy" id="pruhy"></div>
    <main>
      <section class="pohled" data-pohled="dnes" id="p-dnes"></section>
      <section class="pohled pohled-uzky" data-pohled="schranka" id="p-schranka" hidden></section>
      <section class="pohled pohled-posta" data-pohled="posta" id="p-posta" hidden></section>
      <section class="pohled pohled-kalendar" data-pohled="kalendar" id="p-kalendar" hidden></section>
      <section class="pohled pohled-zdravi" data-pohled="zdravi" id="p-zdravi" hidden></section>
      <section class="pohled pohled-fotbal" data-pohled="fotbal" id="p-fotbal" hidden></section>
      <section class="pohled pohled-reely" data-pohled="reely" id="p-reely" hidden></section>
      <section class="pohled pohled-plakaty" data-pohled="plakaty" id="p-plakaty" hidden></section>
      <section class="pohled pohled-auto" data-pohled="auto" id="p-auto" hidden></section>
    </main>
  </div>

  <!-- spodní lišta (telefon) -->
  <nav class="lista" id="lista" aria-label="Sekce"></nav>
</div>

<div id="uvod" class="uvod" hidden></div>

<div id="panely"><div class="panel-pozadi"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px;font-family:sans-serif">Asistent potřebuje zapnutý JavaScript.</p></noscript>
</body>
</html>
